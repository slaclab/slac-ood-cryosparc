---
cluster: "s3df_batch"
form:
  - CRYOSPARC_LICENSE_ID
  - SINGULARITY_IMAGE_TAG
  - CRYOSPARC_DATADIR
  - CRYOSPARC_MIGRATE_FROM
  - CRYOSPARC_LOCAL_WORKER
  - slurm_account
  - slurm_partition
  - bc_num_hours
  - bc_num_cores
  - mem
  - num_gpus
  - slurm_constraint
  - bc_email_on_started
  - advanced_settings
  - SINGULARITY_OPTIONS
  - CRYOSPARC_MASTER_PATH
  - CRYOSPARC_WORKER_PATH
  - CRYOSPARC_CACHE_QUOTA
  - CRYOSPARC_CACHE_FREE
  - OOD_BOOTSTRAP_SCRIPT
  - SINGULARITY_IMAGE
  - desktop
  - bc_vnc_idle
  - bc_vnc_resolution
attributes:
  OOD_BOOTSTRAP_SCRIPT: 
    widget: hidden_field
    value: |
      if [ -z "$CRYOSPARC_DATADIR" ]; then
        echo "ERROR: 'CryoSPARC Datadir' must be set to a directory path." >&2
        exit 1
      fi
      mkdir -p "$CRYOSPARC_DATADIR/run"
      if [ ! -e "$CRYOSPARC_DATADIR/config.sh" ]; then
        cat <<EOF >$CRYOSPARC_DATADIR/config.sh
      export CRYOSPARC_LICENSE_ID=TBA
      export CRYOSPARC_MASTER_HOSTNAME=localhost
      export CRYOSPARC_DB_PATH=$CRYOSPARC_DATADIR/cryosparc_database
      export CRYOSPARC_BASE_PORT=61000
      export CRYOSPARC_DEVELOP=false
      export CRYOSPARC_INSECURE=false
      export CRYOSPARC_CLICK_WRAP=true
      export CRYOSPARC_FORCE_HOSTNAME=true
      export CRYOSPARC_USE_GPU=true
      export CRYOSPARC_CUDA_PATH=/usr/local/cuda
      export CRYOSPARC_FORCE_USER=true
      EOF
      fi
  CRYOSPARC_DATADIR:
    required: true
    help: |
      Directory for this CryoSPARC instance's database and configuration files.
  CRYOSPARC_MIGRATE_FROM:
    label: "Migrate database from v4 (CryoSPARC v5 only)"
    value: $HOME/cryosparc
    help: |
      Path to your existing CryoSPARC v4 data directory &mdash; the one containing
      <code>cryosparc_database</code>. The first time you start a v5 session the
      database found here is <em>copied</em> into the directory above and
      upgraded; the original is never modified. It runs once, and can take from a
      few minutes to over an hour depending on how many projects and jobs you
      have.
      <br><br>
      Clear this field to start a fresh CryoSPARC v5 instance
      instead.
  CRYOSPARC_CACHE_QUOTA:
    value: 2500000
    help: |
      Adjusts the upper limit (in MB) of the CryoSPARC worker cache quota on high performance (SSD) storage
  CRYOSPARC_CACHE_FREE:
    value: 5000
    help: |
      Adjusts the minimum amount of free space (in MB) for the CryoSPARC worker cache to leave on high performance (SSD) storage
    min: 5000
  SINGULARITY_OPTIONS:
    value: "--no-mount tmp -B ${LSCRATCH}:/tmp,$CRYOSPARC_DATADIR/config.sh:$CRYOSPARC_MASTER_PATH/config.sh,$CRYOSPARC_DATADIR/run:$CRYOSPARC_MASTER_PATH/run,$CRYOSPARC_DATADIR/config.sh:$CRYOSPARC_WORKER_PATH/config.sh"
    help: |
      Advanced CryoSPARC session options. *WARNING*&colon; Edit with caution, may cause issues launching CryoSPARC session.
  CRYOSPARC_MASTER_PATH: 
    widget: hidden_field
    value: "/app/cryosparc_master"
  CRYOSPARC_WORKER_PATH:  
    widget: hidden_field
    value: "/app/cryosparc_worker"
  SINGULARITY_IMAGE: 
    widget: hidden_field
    value: "/sdf/group/cryoem/sw/images/cryosparc/#SINGULARITY_IMAGE_TAG/cryosparc-desktop@#SINGULARITY_IMAGE_TAG.sif"
  SINGULARITY_IMAGE_TAG:
    widget: select
    label: "CryoSPARC Version"
    options:
      - [ "5.0.7", "5.0.7-260921-0" ]
      - [ "4.7.0", "4.7.0-0" ]
      - [ "4.6.2", "4.6.2-0" ]
  CRYOSPARC_LOCAL_WORKER:
    label: "Number of CryoSPARC local workers"
    value: "1"
  desktop: "xfce"
  bc_vnc_idle: 0
  bc_vnc_resolution:
    required: true
  bc_num_cores:
    widget: "number_field"
    label: "Number of CPU cores"
    value: 8
    help: |
      Number of CPU cores available for CryoSPARC instance
    min: 8
    max: 44
    step: 4
  mem:
    widget: "number_field"
    value: "32768"
    help: |
      Total memory for CryoSPARC instance in MB.
    min: 16384 
    max: 500000
  num_gpus:
    widget: "number_field"
    label: "Number of GPUs"
    value: 1
    help: |
      Number of GPUs requested; the type of GPU provided will depend upon the Partition selected.
    min: 1
    max: 10
    step: 1
  slurm_account:
    label: "Account"
    help: "Slurm account association (cryoem:&lt;proposal_number&gt;)"
    pattern: "^[a-zA-Z0-9:_\\-]*$"
  slurm_partition:
    widget: select
    label: "Partition"
    help: "Slurm cluster partition (available: roma, turing, ampere, ada)"
    options:
      - [ "Roma (CPU only)", "roma" ] 
      - [ "Turing (NVIDIA 2080Ti)", "turing" ] 
      - [ "Ampere (NVIDIA A100)", "ampere" ] 
      - [ "Ada (NVIDIA L40S)", "ada" ] 
  slurm_reservation:
    label: "Reservation"
    help: "Slurm reservation to use (leave blank to ignore)"
  slurm_constraint:
    label: "Constraints"
    help: "Slurm constraints to use (leave blank to ignore)"
    pattern: "^.*$"
  advanced_settings:
    widget: "check_box"
    label: Show advanced settings...
  CRYOSPARC_LICENSE_ID:
    required: true
    label: "CryoSPARC License ID"
    help: |
      Enter a valid CryoSPARC license ID. You can obtain a new license at https://cryosparc.com/download
